services:
  - type: web
    name: deadlineradar-ai
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: APP_ENV
        value: production

      - key: PYTHON_VERSION
        value: 3.13.7